name: Update World Cup Scores

on:
  schedule:
    - cron: '0 16 * * *'   # 09:00 PDT (UTC-7) — Vancouver time during World Cup
  workflow_dispatch:         # Allow manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch latest scores and update scores.js
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node .github/scripts/update-scores.js

      - name: Commit and push if anything changed
        run: |
          git config user.name  "FIFA 2026 Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.js .github/scripts/processed-fixtures.json
          git diff --staged --quiet \
            && echo "No new matches today — scores.js unchanged." \
            || (git commit -m "chore(scores): auto-update $(date -u +%Y-%m-%d)" && git push)
