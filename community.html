<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 FIFA World Cup — 球迷社群</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4522779931939215" crossorigin="anonymous"></script>
  <style>
    /* ── Poll cards ───────────────────────────────────────── */
    .poll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .poll-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.4rem 1.3rem 1.2rem;
    }
    .poll-card h3 {
      font-size: 0.97rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .poll-options { display: flex; flex-direction: column; gap: 0.55rem; }
    .poll-option {
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg3);
      transition: border-color 0.2s;
    }
    .poll-option:hover { border-color: var(--accent); }
    .poll-option.voted-this  { border-color: var(--gold); }
    .poll-bar {
      position: absolute; inset: 0; left: 0; top: 0;
      background: linear-gradient(90deg, rgba(0,212,170,0.13), rgba(0,212,170,0.05));
      width: 0%; transition: width 0.5s ease;
      border-radius: 8px;
    }
    .poll-option.voted-this .poll-bar {
      background: linear-gradient(90deg, rgba(255,215,0,0.18), rgba(255,215,0,0.06));
    }
    .poll-label {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 0.8rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      z-index: 1;
    }
    .poll-pct {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 34px;
      text-align: right;
    }
    .poll-option.voted-this .poll-pct { color: var(--gold); }
    .poll-footer {
      margin-top: 0.75rem;
      font-size: 0.74rem;
      color: var(--muted);
      text-align: right;
    }
    .poll-btn {
      display: block; width: 100%;
      margin-top: 0.8rem;
      padding: 0.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 0.85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .poll-btn:hover { opacity: 0.85; }
    .poll-btn:disabled { opacity: 0.4; cursor: default; }
    .poll-thanks {
      display: none;
      margin-top: 0.7rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
    }

    /* ── Comments section ─────────────────────────────────── */
    .discuss-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.6rem;
      margin-bottom: 1.5rem;
    }
    .discuss-box h2 {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .discuss-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    /* Comment form */
    .comment-form { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.8rem; }
    .comment-form input, .comment-form textarea {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .comment-form input:focus, .comment-form textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .comment-form textarea { resize: vertical; min-height: 90px; }
    .comment-submit {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.6rem;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .comment-submit:hover { opacity: 0.85; }
    .comment-submit:disabled { opacity: 0.45; cursor: default; }
    /* Comment list */
    .comment-divider {
      font-size: 0.78rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .comment-list { display: flex; flex-direction: column; gap: 1rem; }
    .comment-item {
      display: flex; gap: 0.85rem; align-items: flex-start;
    }
    .comment-avatar {
      flex-shrink: 0;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.95rem; color: #000;
    }
    .comment-body { flex: 1; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .comment-name { font-weight: 800; font-size: 0.88rem; color: var(--text); }
    .comment-time { font-size: 0.74rem; color: var(--muted); }
    .comment-msg  { font-size: 0.88rem; color: var(--text); line-height: 1.6; }
    .comment-empty {
      text-align: center; padding: 2rem 1rem;
      color: var(--muted); font-size: 0.88rem;
    }
    .comment-loading { text-align:center; color:var(--muted); padding:1rem; font-size:0.85rem; }

    /* ── Guidelines ───────────────────────────────────────── */
    .rules-box {
      background: linear-gradient(135deg, rgba(0,212,170,0.06), rgba(255,215,0,0.04));
      border: 1px solid rgba(0,212,170,0.22);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 2rem;
    }
    .rules-box h3 {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    .rules-box p {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.9;
    }
  </style>
</head>
<body data-page-title="community_title">
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">⚽ <span>FIFA 2026</span></a>
    <a href="index.html"     data-i18n="nav_schedule">🗓️ 賽程</a>
    <a href="teams.html"     data-i18n="nav_teams">🌍 球隊&球員</a>
    <a href="analysis.html"  data-i18n="nav_analysis">📊 分析</a>
    <a href="prediction.html"data-i18n="nav_prediction">🔮 預測</a>
    <a href="highlights.html"data-i18n="nav_highlights">🎬 精華</a>
    <a href="betting.html"   data-i18n="nav_betting">🎰 投注</a>
    <a href="scores.html"    data-i18n="nav_scores">⚡ 即時比分</a>
    <a href="community.html" class="active" data-i18n="nav_community">💬 社群</a>
  </div>
</nav>

<div class="hero">
  <div class="badge" data-i18n="community_hero_badge">球迷交流</div>
  <h1 data-i18n="community_hero_h1">💬 球迷互動區</h1>
  <p data-i18n="community_hero_p">分享你的觀點、預測與熱情 — 和全球球迷一起討論 2026 世界盃</p>
</div>

<div class="container">

  <!-- ── Quick Polls ──────────────────────────────── -->
  <div class="section-title" data-i18n="community_section_polls">🗳️ 快速投票</div>
  <p style="color:var(--muted);font-size:0.88rem;margin:-1rem 0 1.25rem" data-i18n="community_polls_sub">投出你的看法，看看球迷們怎麼想</p>

  <div class="poll-grid" id="polls-container"></div>

  <!-- ── Rules ───────────────────────────────────── -->
  <div class="rules-box">
    <h3 data-i18n="community_rules_h">📋 社群守則</h3>
    <p data-i18n-html="community_rules_p">• 友善討論，尊重不同看法<br>• 歡迎分享球隊資訊與賽事分析<br>• 禁止發布不實訊息或垃圾內容<br>• 讓這裡成為球迷交流的最佳空間 ⚽</p>
  </div>

  <!-- ── Comments (Firebase) ───────────────────────── -->
  <div class="discuss-box">
    <h2 data-i18n="community_section_discuss">💬 留言討論</h2>
    <p class="discuss-sub" data-i18n="community_discuss_sub">分享你的觀點、預測或對賽事的任何想法！</p>

    <!-- Comment form -->
    <div class="comment-form" id="comment-form">
      <input type="text" id="comment-name" maxlength="40"
             placeholder="你的名字（可選 / Optional）" />
      <textarea id="comment-msg" maxlength="500"
                placeholder="留下你的想法… / Share your thoughts…"></textarea>
      <button class="comment-submit" id="comment-submit">✈️ 送出留言</button>
    </div>
    <div id="comment-status" style="font-size:0.82rem;color:var(--accent);margin-bottom:1rem;min-height:1.2em"></div>

    <!-- Comments list -->
    <div class="comment-divider" id="comment-divider">載入留言中…</div>
    <div class="comment-list" id="comment-list">
      <div class="comment-loading">⏳</div>
    </div>
  </div>

</div><!-- /container -->

<script src="i18n.js"></script>
<script>
// ── Poll data ────────────────────────────────────────────────
var POLL_DATA = [
  {
    key: 'champion',
    qKey: 'community_poll1_q',
    options: [
      { zh: '🇦🇷 阿根廷', en: '🇦🇷 Argentina', seed: 342 },
      { zh: '🇫🇷 法國',   en: '🇫🇷 France',    seed: 285 },
      { zh: '🇧🇷 巴西',   en: '🇧🇷 Brazil',    seed: 267 },
      { zh: '🇪🇸 西班牙', en: '🇪🇸 Spain',     seed: 198 },
      { zh: '🌍 其他',    en: '🌍 Others',      seed: 108 }
    ]
  },
  {
    key: 'darkhorse',
    qKey: 'community_poll2_q',
    options: [
      { zh: '🇲🇦 摩洛哥', en: '🇲🇦 Morocco',   seed: 312 },
      { zh: '🇺🇸 美國',   en: '🇺🇸 USA',       seed: 287 },
      { zh: '🇯🇵 日本',   en: '🇯🇵 Japan',     seed: 198 },
      { zh: '🇭🇷 克羅埃西亞', en: '🇭🇷 Croatia', seed: 156 },
      { zh: '🌍 其他',    en: '🌍 Others',      seed: 247 }
    ]
  },
  {
    key: 'bestmatch',
    qKey: 'community_poll3_q',
    options: [
      { zh: '🇲🇽 墨西哥 vs 🇵🇱 波蘭（開幕戰）', en: '🇲🇽 Mexico vs 🇵🇱 Poland (Opener)', seed: 189 },
      { zh: '🇦🇷 阿根廷 vs 🇫🇷 法國',           en: '🇦🇷 Argentina vs 🇫🇷 France',         seed: 456 },
      { zh: '🇧🇷 巴西 vs 🇵🇹 葡萄牙',            en: '🇧🇷 Brazil vs 🇵🇹 Portugal',           seed: 312 },
      { zh: '🏆 決賽',                             en: '🏆 The Final',                         seed: 398 },
      { zh: '🌟 黑馬驚喜場',                        en: '🌟 The Dark Horse Upset',               seed: 145 }
    ]
  }
];

var lang = getLang();

// ── Render polls ─────────────────────────────────────────────
function getPollVote(key) {
  try { return JSON.parse(localStorage.getItem('fifa2026_poll_' + key)); } catch(e) { return null; }
}
function setPollVote(key, idx) {
  localStorage.setItem('fifa2026_poll_' + key, JSON.stringify({ idx: idx }));
}

function renderPoll(poll) {
  var stored = getPollVote(poll.key);
  var votedIdx = stored ? stored.idx : -1;
  var hasVoted = votedIdx >= 0;

  // Compute counts = seed + user's vote
  var counts = poll.options.map(function(o, i) {
    return o.seed + (i === votedIdx ? 1 : 0);
  });
  var total = counts.reduce(function(a, b) { return a + b; }, 0);

  var optionsHTML = poll.options.map(function(o, i) {
    var pct = total > 0 ? Math.round(counts[i] / total * 100) : 0;
    var isVoted = i === votedIdx;
    return `<div class="poll-option${isVoted ? ' voted-this' : ''}" data-idx="${i}">
      <div class="poll-bar" style="width:${hasVoted ? pct : 0}%"></div>
      <div class="poll-label">
        <span>${lang === 'en' ? o.en : o.zh}</span>
        <span class="poll-pct">${hasVoted ? pct + '%' : ''}</span>
      </div>
    </div>`;
  }).join('');

  var totalLabel = t('community_poll_total', { n: total.toLocaleString() });
  var btnLabel   = t('community_poll_vote_btn');
  var thanksMsg  = t('community_poll_thanks');

  return `<div class="poll-card" data-poll-key="${poll.key}">
    <h3>${t(poll.qKey)}</h3>
    <div class="poll-options">${optionsHTML}</div>
    <div class="poll-footer">${hasVoted ? totalLabel : ''}</div>
    <button class="poll-btn" ${hasVoted ? 'disabled' : ''}>${hasVoted ? '✓ ' + btnLabel : btnLabel}</button>
    <div class="poll-thanks" ${hasVoted ? 'style="display:block"' : ''}>${thanksMsg}</div>
  </div>`;
}

var container = document.getElementById('polls-container');
container.innerHTML = POLL_DATA.map(renderPoll).join('');

// ── Poll interactivity ────────────────────────────────────────
container.addEventListener('click', function(e) {
  var card = e.target.closest('.poll-card');
  if (!card) return;
  var key = card.dataset.pollKey;
  var poll = POLL_DATA.find(function(p) { return p.key === key; });
  if (!poll || getPollVote(key)) return; // already voted

  // Which option was clicked?
  var opt = e.target.closest('.poll-option');
  var btn = e.target.closest('.poll-btn');
  var clickedIdx = -1;
  if (opt) clickedIdx = parseInt(opt.dataset.idx);

  if (clickedIdx >= 0) {
    // Highlight selection, enable button
    card.querySelectorAll('.poll-option').forEach(function(el) {
      el.style.borderColor = parseInt(el.dataset.idx) === clickedIdx ? 'var(--gold)' : '';
    });
    card.querySelector('.poll-btn').dataset.selected = clickedIdx;
  }

  if (btn) {
    var selected = parseInt(btn.dataset.selected);
    if (isNaN(selected) || selected < 0) return;
    setPollVote(key, selected);
    // Re-render this card
    card.outerHTML = renderPoll(poll);
    // Animate bars
    setTimeout(function() {
      document.querySelectorAll('.poll-card[data-poll-key="' + key + '"] .poll-bar').forEach(function(bar) {
        bar.style.transition = 'width 0.6s ease';
      });
    }, 50);
  }
});

// ── Firebase Realtime Database Comments ───────────────────────
var FB_URL = 'https://fifa-2026-bd106-default-rtdb.firebaseio.com';

// Avatar colour palette
var AVATAR_COLORS = ['#00d4aa','#ffd700','#e74c3c','#3498db','#9b59b6','#e67e22','#1abc9c','#f39c12'];
function avatarColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function timeAgo(ts) {
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60)  return '剛剛';
  if (diff < 3600) return Math.floor(diff/60) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小時前';
  return Math.floor(diff/86400) + ' 天前';
}

function renderComments(data) {
  var list = document.getElementById('comment-list');
  var divider = document.getElementById('comment-divider');

  if (!data) {
    list.innerHTML = '<div class="comment-empty">還沒有留言，來第一個說說話！<br>Be the first to comment! ⚽</div>';
    divider.textContent = '0 則留言';
    return;
  }

  // Firebase returns object; convert to array sorted newest first
  var items = Object.values(data).sort(function(a, b) { return b.timestamp - a.timestamp; });
  divider.textContent = items.length + ' 則留言 · Comments';

  list.innerHTML = items.map(function(c) {
    var displayName = (c.name || '').trim() || '匿名球迷';
    var initial = displayName.charAt(0).toUpperCase();
    var color = avatarColor(displayName);
    var ago = timeAgo(c.timestamp || 0);
    var msg = (c.message || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    return '<div class="comment-item">' +
      '<div class="comment-avatar" style="background:' + color + '">' + initial + '</div>' +
      '<div class="comment-body">' +
        '<div class="comment-meta">' +
          '<span class="comment-name">' + displayName + '</span>' +
          '<span class="comment-time">' + ago + '</span>' +
        '</div>' +
        '<div class="comment-msg">' + msg + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function loadComments() {
  fetch(FB_URL + '/comments.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { renderComments(data); })
    .catch(function() {
      document.getElementById('comment-list').innerHTML =
        '<div class="comment-empty">⚠️ 載入留言失敗，請稍後再試。</div>';
      document.getElementById('comment-divider').textContent = '留言';
    });
}

// Submit handler
document.getElementById('comment-submit').addEventListener('click', function() {
  var nameEl  = document.getElementById('comment-name');
  var msgEl   = document.getElementById('comment-msg');
  var statusEl= document.getElementById('comment-status');
  var btn     = document.getElementById('comment-submit');

  var msg = (msgEl.value || '').trim();
  if (!msg) { statusEl.textContent = '⚠️ 請輸入留言內容！'; return; }

  var payload = {
    name: (nameEl.value || '').trim() || '匿名球迷',
    message: msg,
    timestamp: Date.now()
  };

  btn.disabled = true;
  statusEl.textContent = '送出中…';

  fetch(FB_URL + '/comments.json', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    msgEl.value = '';
    nameEl.value = '';
    statusEl.textContent = '✅ 留言成功！';
    setTimeout(function() { statusEl.textContent = ''; }, 3000);
    loadComments();
  })
  .catch(function() {
    statusEl.textContent = '❌ 送出失敗，請再試一次。';
  })
  .finally(function() { btn.disabled = false; });
});

// Load on page init, refresh every 30 s
loadComments();
setInterval(loadComments, 30000);
</script>
</body>
</html>
