<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 FIFA World Cup — 即時比分</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4522779931939215" crossorigin="anonymous"></script>
  <style>
    .updated-tag {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .updated-tag::before { content: '🕓 '; }

    /* Empty state — shown before the tournament kicks off */
    .empty-box {
      background: linear-gradient(135deg, rgba(255,215,0,0.07), rgba(0,212,170,0.05));
      border: 1px solid rgba(255,215,0,0.28);
      border-radius: 16px;
      padding: 3rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .empty-box .emoji {
      font-size: 3.2rem;
      margin-bottom: 1rem;
    }
    .empty-box h3 {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 0.85rem;
    }
    .empty-box p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.9;
      max-width: 680px;
      margin: 0 auto;
    }
    .empty-box p a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .empty-box p a:hover { text-decoration: underline; }

    /* Results table — populated once matches are completed */
    .score-table-wrap {
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .score-table { width: 100%; border-collapse: collapse; }
    .score-table th {
      background: var(--bg3);
      color: var(--accent);
      padding: 0.7rem 0.9rem;
      text-align: left;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .score-table td {
      padding: 0.75rem 0.9rem;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .score-table tr:last-child td { border-bottom: none; }
    .score-table tr:hover td { background: var(--bg3); }
    .match-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .match-cell .score-val {
      color: var(--gold);
      font-weight: 900;
      font-size: 1.05rem;
      padding: 0.1rem 0.5rem;
      background: rgba(255,215,0,0.08);
      border-radius: 6px;
    }
    .status-pill {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-final { background: rgba(0,212,170,0.18); color: var(--accent); }
    .status-scheduled { background: rgba(255,255,255,0.06); color: var(--muted); }

    .note-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.7;
      margin-top: 1rem;
    }

    /* ── Group standings grid ──────────────────────── */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .group-block {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .group-block-hdr {
      background: linear-gradient(135deg, #1a3a6e, #0d3a2e);
      padding: 0.6rem 1rem;
      font-weight: 900;
      font-size: 0.88rem;
      color: var(--gold);
      letter-spacing: 0.4px;
    }
    .table-scroll { overflow-x: auto; }
    .stand-tbl { width: 100%; border-collapse: collapse; }
    .stand-hrow th {
      background: var(--bg3);
      color: var(--muted);
      padding: 0.42rem 0.55rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .stand-hrow .th-team { text-align: left; min-width: 120px; }
    .stand-tbl .srow td {
      padding: 0.52rem 0.55rem;
      text-align: center;
      font-size: 0.83rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .stand-tbl .srow:last-child td { border-bottom: none; }
    .stand-tbl .srow:hover td { background: rgba(255,255,255,0.03); }
    .stand-tbl .srow.qualify { border-left: 3px solid var(--accent); }
    .stand-tbl .scol-pos { color: var(--muted); font-size: 0.76rem; width: 22px; }
    .stand-tbl .scol-team { text-align: left; font-weight: 600; white-space: nowrap; padding-right: 0.75rem; }
    .stand-tbl .scol-team span { margin-left: 0.28rem; }
    .stand-tbl .scol-gd { color: var(--muted); font-size: 0.8rem; }
    .stand-tbl .scol-pts { font-weight: 900; color: var(--gold); }
    .qualify-legend {
      font-size: 0.74rem; color: var(--muted);
      margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .qualify-bar {
      display: inline-block; width: 10px; height: 10px;
      background: var(--accent); border-radius: 2px;
    }
    @media (max-width: 600px) {
      .standings-grid { grid-template-columns: 1fr; }
    }

    /* ── Knockout stage ────────────────────────────────── */
    .ko-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .ko-round-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .ko-round-card.ko-final {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255,215,0,0.12);
      grid-column: 1 / -1;
    }
    .ko-round-hdr {
      background: linear-gradient(135deg, #1a2e5c, #0d3a28);
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--gold);
    }
    .ko-final .ko-round-hdr { background: linear-gradient(135deg, #5a3800, #3a2600); }
    .ko-dates { font-size: 0.72rem; font-weight: 400; color: var(--muted); }
    .ko-round-body { padding: 0.25rem 0; }
    .ko-match {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.84rem;
    }
    .ko-match:last-child { border-bottom: none; }
    .ko-team { flex: 1; font-weight: 600; }
    .ko-team.right { text-align: right; }
    .ko-score {
      color: var(--gold);
      font-weight: 900;
      padding: 0.1rem 0.55rem;
      background: rgba(255,215,0,0.08);
      border-radius: 6px;
      white-space: nowrap;
      font-size: 0.95rem;
    }
    .ko-tbd {
      padding: 1.1rem 1.25rem;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }
    .ko-coming-soon {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .ko-coming-soon .ko-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    /* ── Match detail row (goals / cards / description) ── */
    .match-detail {
      padding: 0.55rem 1rem 0.8rem;
      background: rgba(255,255,255,0.018);
    }
    .match-events {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.1rem;
      font-size: 0.78rem;
      margin-bottom: 0.45rem;
    }
    .match-events .evt-goal { color: var(--text); }
    .match-events .evt-red  { color: #e05555; }
    .match-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.65;
      font-style: italic;
    }
    @media (max-width: 600px) {
      .ko-grid { grid-template-columns: 1fr; }
      .ko-round-card.ko-final { grid-column: auto; }
    }
  </style>
</head>

<div class="hero">
  <div class="badge" data-i18n="score_hero_badge">每日更新</div>
  <h1 data-i18n="score_hero_h1">⚡ 各隊最終比分追蹤</h1>
  <p data-i18n="score_hero_p">賽事開打後（2026年6月11日起），本頁將每日自動更新所有完場賽事的最終比分</p>
</div>

<div class="container">

  <div class="updated-tag" id="updated-tag" style="margin-bottom:1rem"></div>

  <!-- ── Score page tabs ─────────────────────────────── -->
  <div class="tabs">
    <button class="tab-btn active" data-stab="results">📋 最新賽果</button>
    <button class="tab-btn" data-stab="standings">📊 小組積分</button>
    <button class="tab-btn" data-stab="knockout">🏆 淘汰賽</button>
  </div>

  <!-- Tab: Latest results -->
  <div class="tab-pane active" id="stab-results">
    <div id="scores-area"></div>
  </div>

  <!-- Tab: Group standings -->
  <div class="tab-pane" id="stab-standings">
    <div class="qualify-legend">
      <span class="qualify-bar"></span>
      <span data-i18n="score_qualify_legend">綠色側邊欄 = 晉級小組第16強（前兩名）</span>
    </div>
    <div class="standings-grid" id="standings-grid"></div>
  </div>

  <!-- Tab: Knockout stage -->
  <div class="tab-pane" id="stab-knockout">
    <div id="knockout-area"></div>
  </div>

  <div class="note-box" data-i18n="score_note">📡 比分資料每日自動擷取並更新，若有錯誤或延遲，請以 FIFA 官方網站 (fifa.com) 公告為準。</div>
</div>
