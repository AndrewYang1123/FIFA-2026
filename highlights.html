<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 FIFA World Cup — 歷屆決賽精華</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4522779931939215" crossorigin="anonymous"></script>
  <style>
    .finals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }
    .final-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .final-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .final-card-header {
      background: linear-gradient(135deg, #1a3a6e, #0d3a2e);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .year-badge {
      background: var(--gold);
      color: #000;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      white-space: nowrap;
    }
    .final-title { flex: 1; }
    .final-title h3 { font-size: 1rem; font-weight: 800; color: var(--text); }
    .final-title p { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .score-display {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      white-space: nowrap;
    }
    .video-wrapper {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .video-placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1628, #1a2a4e);
      cursor: pointer;
      gap: 0.75rem;
    }
    .video-placeholder .play-btn {
      width: 64px; height: 64px;
      background: rgba(255,215,0,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      transition: transform 0.2s;
    }
    .video-placeholder:hover .play-btn { transform: scale(1.1); }
    .video-placeholder p { color: var(--muted); font-size: 0.82rem; text-align: center; max-width: 240px; }
    .final-info {
      padding: 0.85rem 1.25rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .final-info span {
      font-size: 0.75rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.15rem 0.6rem;
      color: var(--muted);
    }
    .final-info .host-badge { color: var(--accent); border-color: rgba(0,212,170,0.3); }
    .goals-list {
      padding: 0 1.25rem 1rem;
    }
    .goals-list h4 { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
    .goal-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
    }
    .goal-item:last-child { border-bottom: none; }
    .goal-min {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent2);
      width: 36px;
      flex-shrink: 0;
    }
    .goal-scorer { flex: 1; color: var(--text); font-weight: 600; }
    .goal-team { font-size: 0.7rem; color: var(--muted); }
    .goal-type {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-weight: 700;
    }
    .goal-type.pen { background: rgba(239,68,68,0.15); color: #ef4444; }
    .goal-type.og { background: rgba(245,158,11,0.15); color: var(--accent2); }
    .goal-type.normal { background: rgba(0,212,170,0.1); color: var(--accent); }
    .champion-ribbon {
      background: linear-gradient(90deg, var(--gold), #ffb700);
      color: #000;
      text-align: center;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 0.3rem;
      letter-spacing: 0.5px;
    }
    .search-btn {
      display: block;
      margin: 0.75rem 1.25rem;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s;
    }
    .search-btn:hover { background: #cc0000; }
    .filter-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-label { color: var(--muted); font-size: 0.85rem; }
    .timeline-strip {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
      scrollbar-width: thin;
    }
    .timeline-dot {
      flex-shrink: 0;
      background: var(--bg2);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 80px;
    }
    .timeline-dot:hover, .timeline-dot.active {
      border-color: var(--gold);
      background: rgba(255,215,0,0.08);
    }
    .timeline-dot .t-year { font-weight: 900; font-size: 0.9rem; color: var(--gold); }
    .timeline-dot .t-champ { font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }
    .notice-box {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .notice-box strong { color: var(--accent2); }
  </style>
</head>

// Timeline
const strip = document.getElementById('timeline-strip');
FINALS.forEach((f, i) => {
  const dot = document.createElement('div');
  dot.className = 'timeline-dot' + (i===0?' active':'');
  dot.id = 'tl-'+f.year;
  dot.innerHTML = `<div class="t-year">${f.year}</div><div class="t-champ">${f.champFlag} ${tx(f.champion)}</div>`;
  dot.onclick = () => {
    document.querySelectorAll('.timeline-dot').forEach(d=>d.classList.remove('active'));
    dot.classList.add('active');
    document.getElementById('final-'+f.year).scrollIntoView({behavior:'smooth', block:'start'});
  };
  strip.appendChild(dot);
});

// Finals cards
const container = document.getElementById('finals-container');
FINALS.forEach(f => {
  const card = document.createElement('div');
  card.className = 'final-card';
  card.id = 'final-'+f.year;

  const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(f.ytSearch)}`;
  const ytEmbedUrl = `https://www.youtube.com/embed/${f.ytId}?start=0&rel=0&modestbranding=1`;

  const champion = tx(f.champion);
  const runner = tx(f.runner);
  const host = tx(f.host);
  const venue = tx(f.venue);

  const goalRows = f.goals.map(g => `
    <div class="goal-item">
      <span class="goal-min">${g.min}</span>
      <span class="goal-scorer">${tx(g.scorer)}</span>
      <span class="goal-team">${tx(g.team)}</span>
      <span class="goal-type ${g.type}">${g.type==='pen'?t('hl_tag_pen'):g.type==='og'?t('hl_tag_og'):'⚽'}</span>
    </div>`).join('');

  card.innerHTML = `
    <div class="champion-ribbon">${t('hl_champion_ribbon', {flag: f.champFlag, champion: champion})}</div>
    <div class="final-card-header">
      <div class="year-badge">${f.year}</div>
      <div class="final-title">
        <h3>${f.champFlag} ${champion} vs ${f.runnerFlag} ${runner}</h3>
        <p>${t('hl_host_label', {host: host, venue: venue})}</p>
      </div>
      <div class="score-display">${f.score}</div>
    </div>
    <div class="video-wrapper" id="vw-${f.year}" style="cursor:pointer" onclick="loadVideo(this, '${ytEmbedUrl}', '${ytSearchUrl}')">
      <div class="video-placeholder">
        <div class="play-btn">▶</div>
        <p><strong style="color:var(--text)">${t('hl_video_title', {year: f.year})}</strong><br>${champion} vs ${runner}<br><span style="font-size:0.75rem">${t('hl_click_to_play')}</span></p>
      </div>
    </div>
    <div class="final-info">
      <span class="host-badge">🌍 ${host}</span>
      <span>👥 ${f.attendance}</span>
      <span>📍 ${f.venue.split(',')[0]}</span>
      <span>${t('hl_goals_count', {n: f.goals.length})}</span>
    </div>
    <div class="goals-list">
      <h4>${t('hl_goals_record')}</h4>
      ${goalRows}
    </div>
    <p style="padding:0 1.25rem;font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;font-style:italic">${tx(f.desc)}</p>
    <a href="${ytSearchUrl}" target="_blank" class="search-btn">
      ${t('hl_search_btn')}
    </a>`;

  container.appendChild(card);
});

function loadVideo(wrapper, embedUrl, searchUrl) {
  // Try to load the YouTube embed; if it fails, open search
  wrapper.style.cursor = 'default';
  wrapper.onclick = null;
  wrapper.innerHTML = `<iframe
    src="${embedUrl}"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>`;
  // Listen for embed error and fall back to YouTube search
  const iframe = wrapper.querySelector('iframe');
  iframe.onload = function() {
    // After 3s if no video, show fallback
    setTimeout(() => {
      try {
        if (iframe.contentDocument && iframe.contentDocument.body.innerText.includes('unavailable')) {
          wrapper.innerHTML = `<div class="video-placeholder" onclick="window.open('${searchUrl}','_blank')">
            <div class="play-btn">▶</div>
            <p>${t('hl_unembeddable')}</p>
          </div>`;
        }
      } catch(e) {} // Cross-origin, ignore
    }, 3000);
  };
}
