<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 FIFA World Cup — 完整賽程</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">⚽ <span>FIFA 2026</span></a>
    <a href="index.html" class="active">🗓️ 賽程</a>
    <a href="teams.html">🌍 球隊&球員</a>
    <a href="analysis.html">📊 分析</a>
    <a href="prediction.html">🔮 預測</a>
    <a href="highlights.html">🎬 精華</a>
    <a href="betting.html">🎰 投注</a>
  </div>
</nav>

<div class="hero">
  <div class="badge">2026 FIFA World Cup™</div>
  <h1>完整賽程總覽</h1>
  <p>從首場比賽到決賽冠軍 — 48支球隊，104場比賽，一個冠軍</p>
  <p style="margin-top:0.5rem;color:var(--accent)">📍 美國 · 加拿大 · 墨西哥 &nbsp;|&nbsp; 🗓️ 2026年6月11日 — 7月23日</p>
</div>

<div class="container">
  <div class="stats-strip">
    <div class="stat-box"><div class="num">48</div><div class="lbl">參賽球隊</div></div>
    <div class="stat-box"><div class="num">12</div><div class="lbl">組別數量</div></div>
    <div class="stat-box"><div class="num">104</div><div class="lbl">總比賽場數</div></div>
    <div class="stat-box"><div class="num">16</div><div class="lbl">比賽場館</div></div>
    <div class="stat-box"><div class="num">3</div><div class="lbl">主辦國家</div></div>
    <div class="stat-box"><div class="num">43</div><div class="lbl">比賽天數</div></div>
  </div>

  <!-- GROUPS -->
  <div class="section-title">⚽ 分組情況 — 12組共48隊</div>
  <div id="groups-container" class="groups-grid fade-in"></div>

  <!-- SCHEDULE -->
  <div class="section-title" style="margin-top:2rem">🗓️ 完整賽程 — 從首場到決賽</div>

  <div class="tabs" id="phase-tabs"></div>
  <div id="schedule-container"></div>
</div>

<!-- VENUES -->
<div style="background:var(--bg2);border-top:1px solid var(--border);margin-top:2rem;padding:2rem 0">
  <div class="container">
    <div class="section-title">🏟️ 16座比賽場館</div>
    <div id="venues-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
// Render Groups
const gc = document.getElementById('groups-container');
GROUPS.forEach(g => {
  const div = document.createElement('div');
  div.className = 'group-card';
  div.innerHTML = `<div class="group-header">🏆 第${g.id}組 <span>(${g.teams.map(t=>t.conf).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')})</span></div>`
    + g.teams.map(t => `<div class="team-row"><span class="team-flag">${t.flag}</span><span class="team-name">${t.name}${t.host?'<sup style="color:var(--accent);font-size:0.65rem"> 主</sup>':''}</span><span class="team-rank">FIFA #${t.rank}</span></div>`).join('');
  gc.appendChild(div);
});

// Render Schedule by phase
const phases = [...new Set(SCHEDULE.map(m => m.phase))];
const tabsEl = document.getElementById('phase-tabs');
const schedEl = document.getElementById('schedule-container');

phases.forEach((phase, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.textContent = phase;
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pane-'+i).classList.add('active');
  };
  tabsEl.appendChild(btn);

  const pane = document.createElement('div');
  pane.className = 'tab-pane' + (i===0?' active':'');
  pane.id = 'pane-'+i;

  const matches = SCHEDULE.filter(m => m.phase === phase);
  const rounds = [...new Set(matches.map(m=>m.round))];

  rounds.forEach(round => {
    const roundMatches = matches.filter(m=>m.round===round);
    const block = document.createElement('div');
    block.className = 'phase-block';
    block.innerHTML = `<div class="phase-label">${round} — ${roundMatches[0].date}</div>`;
    const grid = document.createElement('div');
    grid.className = 'matches-grid';
    roundMatches.forEach(m => {
      const card = document.createElement('div');
      card.className = 'match-card' + (m.featured ? ' ' : '');
      if(m.featured) card.style.border = '1px solid var(--gold)';
      card.innerHTML = `
        <div class="match-teams">
          <div class="match-team">${m.homeFlag} ${m.home}</div>
          <div class="vs">VS</div>
          <div class="match-team away">${m.away} ${m.awayFlag}</div>
        </div>
        <div class="match-info">
          ${m.group ? `<span>第${m.group}組</span>` : ''}
          <span>📅 ${m.date}</span>
          <span>⏰ ${m.time}</span>
          <span class="venue">🏟️ ${m.venue}</span>
        </div>`;
      grid.appendChild(card);
    });
    block.appendChild(grid);
    pane.appendChild(block);
  });
  schedEl.appendChild(pane);
});

// Venues
const vg = document.getElementById('venues-grid');
VENUES.forEach(v => {
  const d = document.createElement('div');
  d.className = 'card';
  d.style.display='flex';d.style.flexDirection='column';d.style.gap='0.25rem';
  d.innerHTML = `<strong style="color:var(--text)">${v.name}</strong><span style="font-size:0.82rem;color:var(--muted)">📍 ${v.city}</span><span style="font-size:0.78rem;color:var(--accent)">容量: ${v.cap.toLocaleString()}</span>`;
  vg.appendChild(d);
});
</script>
</body>
</html>
